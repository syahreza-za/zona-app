[package]
name = "zona-desktop"
version = "0.1.0"
description = "ZONA native desktop shell for macOS and Windows"
authors = ["Syahreza Muharman"]
edition = "2021"

[lib]
name = "zona_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
